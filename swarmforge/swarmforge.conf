# Fleet policy: no codex. Grok is the default coder backend; every other
# role runs on claude. See swarmforge.env for the model assignments
# (fable for architect/specifier, opus for the rest) and the coder's
# one-flip fallback if grok isn't available.
window specifier claude master
window coder     grok   coder
window refactorer claude refactorer
window architect claude architect

# Optional QA gate — black-box / end-to-end verification of the running app.
# Opt-in: uncomment to add a QA agent. Requires swarmforge/qa.prompt present.
# Fields: window <role> <agent> <worktree> <notifies>
# window qa claude qa architect
